<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Processor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>File Processor</h1>

    <div class="card">
        <h2>1. Create Task</h2>

        <div class="form-group">
            <label for="operationType">Select Operation</label>
            <select id="operationType" onchange="renderOperationUI()">
                <option value="">-- Choose Operation --</option>
                <option value="compress">File Compression</option>
                <option value="add_watermark">Add Watermark</option>
                <option value="convert_format">Convert Format</option>
            </select>
        </div>

        <div id="opts-compress" class="dynamic-section">
            <div class="form-group">
                <label for="file-compress">Select File to Compress</label>
                <input type="file" id="file-compress">
            </div>
            <div class="form-group">
                <label for="ratio">Compression Level (1-9)</label>
                <input type="text" id="ratio" placeholder="e.g. 6">
            </div>
        </div>

        <div id="opts-add_watermark" class="dynamic-section">
            <div class="form-group">
                <label for="file-watermark">Select Image/PDF</label>
                <input type="file" id="file-watermark">
            </div>
            <div class="form-group">
                <label for="watermarkText">Watermark Text</label>
                <input type="text" id="watermarkText" placeholder="e.g. CONFIDENTIAL">
            </div>
        </div>

        <div id="opts-convert_format" class="dynamic-section">
            <div class="form-group">
                <label for="file-convert">Select Source File</label>
                <input type="file" id="file-convert">
            </div>
            <div class="form-group">
                <label for="targetFormat">Target Format</label>
                <input type="text" id="targetFormat" placeholder="e.g. pdf, png, txt">
            </div>
        </div>

        <button id="submitBtn" onclick="submitTask()" disabled>Submit Task</button>
    </div>

    <div class="card">
        <h2>2. Track & Download</h2>
        <div class="form-group">
            <label for="trackTaskId">Task ID</label>
            <input type="text" id="trackTaskId" placeholder="Enter UUID">
        </div>
        <button onclick="checkStatus()">Check Status</button>

        <div id="statusResult" class="hidden" style="margin-top: 16px;">
            <p><strong>Status:</strong> <span id="statusBadge" class="status-badge"></span></p>
            <p id="timeContainer"><strong>Created At:</strong> <span id="createdAt"></span></p>
            <p id="errorContainer" class="hidden" style="color: red;"><strong>Error:</strong> <span
                    id="errorMsg"></span></p>

            <button id="downloadBtn" class="hidden" onclick="downloadFile()">Download Output File</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
